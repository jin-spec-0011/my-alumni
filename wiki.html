<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>회칙 및 연혁 - 5인 동창 곗모임</title>

  <!-- 단독 웹앱 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="5인곗모임">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-16 font-sans">

  <!-- 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">📜</span>
        <div>
          <h1 class="font-black text-base text-slate-900 leading-tight">회칙 & 아카이브</h1>
          <span class="text-[10px] text-slate-400 font-medium">동창 규약 및 공식 연혁</span>
        </div>
      </div>
      <span id="current-rev-badge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">
        판본 로딩 중...
      </span>
    </div>

    <!-- 메인 네비게이션 -->
    <nav class="flex items-center justify-between border-t border-slate-100 mt-2.5 pt-2 text-xs">
      <div class="flex space-x-1 overflow-x-auto no-scrollbar font-bold">
        <a href="index.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">대시보드</a>
        <a href="history.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">과거 여행</a>
        <a href="wiki.html" class="py-1.5 px-2 bg-blue-50 text-blue-600 rounded-lg whitespace-nowrap">회칙</a>
        <a href="settlement.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">개별 정산</a>
        <a href="election.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회장 선출</a>
      </div>

      <div class="relative inline-block text-left ml-1 flex-shrink-0">
        <button id="btn-dropdown" type="button" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg whitespace-nowrap flex items-center gap-1 border border-slate-200">
          <span>더보기 ▾</span>
        </button>
        <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-36 bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 z-50 text-xs font-semibold">
          <a href="gathering.html" class="block px-3 py-2 text-slate-700 hover:bg-slate-50 flex items-center gap-2">
            <i class="fa-solid fa-bullhorn text-amber-600 w-3.5"></i><span>모임 공표</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto p-4 space-y-4">

    <!-- 서브 뷰 전환 탭 (전문 / 개정 로그 / 회장 연혁) -->
    <div class="bg-white p-1 rounded-xl border border-slate-200 flex text-xs font-bold shadow-sm">
      <button id="tab-btn-doc" class="flex-1 py-2 rounded-lg bg-slate-900 text-white transition">회칙 전문</button>
      <button id="tab-btn-logs" class="flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-1">
        <span>개정 로그</span>
        <span id="log-count-pill" class="text-[9px] bg-slate-200 text-slate-700 px-1.5 py-0.2 rounded-full font-mono">0</span>
      </button>
      <button id="tab-btn-history" class="flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-1">
        <span>👑 회장 연혁</span>
      </button>
    </div>

    <!-- 1. [회칙 전문 뷰] -->
    <section id="view-doc" class="space-y-3">
      <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <div>
            <h2 class="font-black text-sm text-slate-900">5인 동창 곗모임 정관</h2>
            <div class="text-[10px] text-slate-400 mt-0.5" id="rule-meta-info">최종 갱신일: 로딩 중...</div>
          </div>
          <button id="btn-open-manual-edit" class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-lg font-bold">
            수동 개정
          </button>
        </div>

        <div id="rule-content-display" class="text-xs text-slate-700 leading-relaxed whitespace-pre-wrap font-sans space-y-2">
          회칙 본문을 동기화하는 중입니다...
        </div>
      </div>
    </section>

    <!-- 2. [회칙 개정 로그 뷰] -->
    <section id="view-logs" class="hidden space-y-3">
      <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
        <div class="border-b pb-2 flex justify-between items-center">
          <div>
            <h3 class="font-bold text-sm text-slate-900">회칙 개정 로그 (Revision Log)</h3>
            <p class="text-[11px] text-slate-400">모든 변경 사항(수동·자동)이 영구 보존됩니다.</p>
          </div>
          <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">영구 기록</span>
        </div>

        <div id="revisions-timeline" class="space-y-2 text-xs">
          <div class="p-6 text-center text-slate-400">로그 데이터를 불러오는 중...</div>
        </div>
      </div>
    </section>

    <!-- 3. [역대 회장 연혁 뷰] -->
    <section id="view-history" class="hidden space-y-3">
      <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
        <div class="border-b pb-2 flex justify-between items-center">
          <div>
            <h3 class="font-bold text-sm text-slate-900">역대 회장단 연혁사 (Chronicle)</h3>
            <p class="text-[11px] text-slate-400">2019년 창립 이래 역대 회장 재임 기록</p>
          </div>
          <span class="text-[10px] bg-amber-100 text-amber-900 font-bold px-2 py-0.5 rounded">공식 연혁</span>
        </div>

        <div id="presidents-timeline" class="space-y-2.5 text-xs">
          <div class="p-6 text-center text-slate-400">연혁 데이터를 불러오는 중...</div>
        </div>
      </div>
    </section>

    <!-- 수동 개정 모달 -->
    <div id="manual-edit-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="font-bold text-sm text-slate-900">회칙 전문 수동 개정</h3>
          <button id="btn-close-manual-edit" class="text-slate-400 text-lg px-2">✕</button>
        </div>

        <form id="manual-edit-form" class="space-y-3 text-xs">
          <textarea id="edit-rule-textarea" rows="12" class="w-full p-2.5 border rounded-lg text-xs leading-relaxed font-mono focus:ring-2 focus:ring-blue-500"></textarea>

          <div>
            <label class="block font-bold text-slate-700 mb-1">편집 요약 (필수 의무제)</label>
            <input type="text" id="edit-rule-summary" placeholder="예: 제8조 식대 결제 규정 문구 구체화" required class="w-full p-2 border rounded-lg font-medium">
          </div>

          <div class="flex justify-between items-center p-2 bg-slate-50 border rounded-lg">
            <span class="font-bold text-slate-700">개정자 확인</span>
            <select id="select-edit-author" class="p-1 border rounded bg-white font-bold text-slate-800">
              <option value="김진세" selected>김진세</option>
              <option value="송환오">송환오</option>
              <option value="장우석">장우석</option>
              <option value="김정수">김정수</option>
              <option value="이해웅">이해웅</option>
            </select>
          </div>

          <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition">
            개정안 저장 (새 판본 로그 생성)
          </button>
        </form>
      </div>
    </div>

  </main>

  <script type="module">
    import { db } from "./js/firebase.js";
    import { 
      doc, 
      setDoc, 
      getDocs, 
      collection, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 드롭다운 제어
    const btnDropdown = document.getElementById("btn-dropdown");
    const dropdownMenu = document.getElementById("dropdown-menu");
    btnDropdown.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("hidden");
    });
    document.addEventListener("click", () => dropdownMenu.classList.add("hidden"));

    // 뷰 탭 전환 제어
    const viewDoc = document.getElementById("view-doc");
    const viewLogs = document.getElementById("view-logs");
    const viewHistory = document.getElementById("view-history");
    const tabBtnDoc = document.getElementById("tab-btn-doc");
    const tabBtnLogs = document.getElementById("tab-btn-logs");
    const tabBtnHistory = document.getElementById("tab-btn-history");

    function switchView(target) {
      [tabBtnDoc, tabBtnLogs, tabBtnHistory].forEach(b => b.className = "flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-1");
      [viewDoc, viewLogs, viewHistory].forEach(v => v.classList.add("hidden"));

      if (target === "doc") {
        tabBtnDoc.className = "flex-1 py-2 rounded-lg bg-slate-900 text-white transition";
        viewDoc.classList.remove("hidden");
      } else if (target === "logs") {
        tabBtnLogs.className = "flex-1 py-2 rounded-lg bg-slate-900 text-white transition flex items-center justify-center gap-1";
        viewLogs.classList.remove("hidden");
      } else if (target === "history") {
        tabBtnHistory.className = "flex-1 py-2 rounded-lg bg-slate-900 text-white transition flex items-center justify-center gap-1";
        viewHistory.classList.remove("hidden");
      }
    }

    tabBtnDoc.onclick = () => switchView("doc");
    tabBtnLogs.onclick = () => switchView("logs");
    tabBtnHistory.onclick = () => switchView("history");

    // 수동 개정 모달 제어
    const editModal = document.getElementById("manual-edit-modal");
    const editTextarea = document.getElementById("edit-rule-textarea");
    document.getElementById("btn-open-manual-edit").onclick = () => {
      editTextarea.value = currentFullText;
      editModal.classList.remove("hidden");
    };
    document.getElementById("btn-close-manual-edit").onclick = () => editModal.classList.add("hidden");

    let currentFullText = "";
    let currentRev = "r1";

    // 1. 회칙 전문 실시간 리스너
    try {
      onSnapshot(doc(db, "rule_content", "latest"), (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          currentFullText = data.content;
          currentRev = data.rev || "r1";

          document.getElementById("current-rev-badge").innerText = `판본: ${currentRev}`;
          document.getElementById("rule-meta-info").innerText = `최종 갱신: ${data.updatedAt || '-'} (기록자: ${data.author || '회원'})`;
          document.getElementById("rule-content-display").innerText = data.content;
        }
      });
    } catch (e) {
      console.error(e);
    }

    // 2. 회칙 개정 로그 실시간 리스너 (rule_revisions 영구 목록)
    try {
      onSnapshot(collection(db, "rule_revisions"), (snapshot) => {
        const container = document.getElementById("revisions-timeline");
        container.innerHTML = "";
        const list = [];
        snapshot.forEach(d => list.push(d.data()));
        // 최신순 정렬
        list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));

        document.getElementById("log-count-pill").innerText = list.length;

        if (list.length === 0) {
          container.innerHTML = `<div class="p-6 text-center text-slate-400">보존된 개정 로그가 없습니다.</div>`;
          return;
        }

        list.forEach((rev, idx) => {
          const card = document.createElement("div");
          card.className = "p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1";
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-1.5">
                <span class="font-black px-2 py-0.5 rounded text-[11px] ${idx === 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-700'}">${rev.rev}</span>
                <strong class="text-slate-800">${rev.author}</strong>
              </div>
              <span class="text-[10px] text-slate-400 font-mono">${rev.date}</span>
            </div>
            <p class="text-[11px] text-slate-600 font-medium pl-0.5 leading-relaxed">${rev.summary || '상세 사유 없음'}</p>
          `;
          container.appendChild(card);
        });
      });
    } catch (e) {
      console.error(e);
    }

    // 3. 역대 회장 연혁 실시간 리스너 (election_history & 창립 연혁)
    try {
      onSnapshot(collection(db, "election_history"), (snapshot) => {
        const container = document.getElementById("presidents-timeline");
        container.innerHTML = "";

        // 창립 1대 송환오 회장 기본 박제
        const defaultFirst = {
          term: "제1대",
          winner: "송환오",
          date: "2019-09-07",
          confirmedBy: "창립총회 룰렛 추첨",
          note: "5인 동창 곗모임 결성 및 초대 회장 공식 취임"
        };

        const list = [];
        snapshot.forEach(d => list.push(d.data()));
        list.sort((a, b) => (a.date || "").localeCompare(b.date || ""));

        // 1대부터 순차적으로 연혁 조립
        const fullChronicle = [defaultFirst];
        list.forEach((item, i) => {
          fullChronicle.push({
            term: `제${i + 2}대`,
            winner: item.winner,
            date: item.date,
            confirmedBy: item.confirmedBy,
            note: item.note || `대통령 임기 연동 선출 승인 (승인자: ${item.confirmedBy})`
          });
        });

        // 최신 역순(최신 당선자가 상단)으로 렌더링
        fullChronicle.reverse().forEach((p, index) => {
          const isCurrent = (index === 0);
          const card = document.createElement("div");
          card.className = `p-3 rounded-xl border ${isCurrent ? 'bg-amber-50/80 border-amber-300' : 'bg-slate-50 border-slate-200'} space-y-1`;
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-1.5">
                <span class="font-black px-2 py-0.5 rounded text-[10px] ${isCurrent ? 'bg-amber-400 text-slate-950 font-black' : 'bg-slate-200 text-slate-700'}">${p.term}</span>
                <strong class="text-sm text-slate-900">${p.winner} 회장</strong>
                ${isCurrent ? '<span class="text-[10px] text-amber-700 font-bold ml-1">● 현직</span>' : ''}
              </div>
              <span class="text-[10px] text-slate-400 font-mono">${p.date}</span>
            </div>
            <div class="text-[11px] text-slate-600 pl-0.5 leading-relaxed">${p.note}</div>
          `;
          container.appendChild(card);
        });
      });
    } catch (e) {
      console.error(e);
    }

    // 수동 개정 제출
    document.getElementById("manual-edit-form").onsubmit = async (e) => {
      e.preventDefault();
      const newText = editTextarea.value.trim();
      const summary = document.getElementById("edit-rule-summary").value.trim();
      const author = document.getElementById("select-edit-author").value;

      const revSnap = await getDocs(collection(db, "rule_revisions"));
      const nextRev = `r${revSnap.size + 1}`;
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      const newRec = { rev: nextRev, date: dateStr, author: author, summary: summary };

      try {
        await setDoc(doc(db, "rule_content", "latest"), {
          content: newText,
          updatedAt: dateStr,
          author: author,
          rev: nextRev,
          summary: summary
        });
        await setDoc(doc(db, "rule_revisions", nextRev), newRec);

        alert(`🎉 회칙 개정안이 [${nextRev}] 판본으로 저장되었습니다.`);
        editModal.classList.add("hidden");
        document.getElementById("manual-edit-form").reset();
      } catch (err) {
        alert(`❌ 저장 실패: ${err.message}`);
      }
    };
  </script>

</body>
</html>
