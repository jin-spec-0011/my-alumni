<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>회칙 - 5인 동창 곗모임</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-16 font-sans">

  <!-- 공통 상단 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">📜</span>
        <div>
          <h1 class="font-black text-base text-slate-900 leading-tight">5인 동창 곗모임 회칙</h1>
          <span class="text-[10px] text-slate-400 font-medium">Since 2019 합의 계칙</span>
        </div>
      </div>
      <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">자율 개정 모드</span>
    </div>

    <!-- 5대 메인 탭 + 부가기능 콤보박스 -->
    <nav class="flex items-center justify-between border-t border-slate-100 mt-2.5 pt-2 text-xs">
      <div class="flex space-x-1 overflow-x-auto no-scrollbar font-bold">
        <a href="index.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">대시보드</a>
        <a href="history.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">과거 여행</a>
        <a href="wiki.html" class="py-1.5 px-2 bg-blue-50 text-blue-600 rounded-lg whitespace-nowrap">회칙</a>
        <a href="settlement.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">개별 정산</a>
        <a href="election.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회장 선출</a>
      </div>

      <div class="relative inline-block text-left ml-1 flex-shrink-0">
        <button id="btn-dropdown" type="button" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg whitespace-nowrap flex items-center gap-1 border border-slate-200">
          <span>더보기 ▾</span>
        </button>
        <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-36 bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 z-50 text-xs font-semibold">
          <a href="gathering.html" class="block px-3 py-2 text-slate-700 hover:bg-slate-50 flex items-center gap-2">
            <i class="fa-solid fa-calendar-check text-blue-600 w-3.5"></i><span>모임 & 예약</span>
          </a>
          <a href="ledger.html" class="block px-3 py-2 text-slate-700 hover:bg-slate-50 flex items-center gap-2">
            <i class="fa-solid fa-won-sign text-amber-600 w-3.5"></i><span>회비 장부</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto p-4 space-y-4">

    <!-- 문서 헤더 & 3대 서브 탭 -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <div>
          <span class="text-[10px] font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded">BYLAWS-001</span>
          <h2 class="text-base font-black text-slate-900 mt-1">공식 회칙 전문 (제1조~제10조)</h2>
        </div>
        <div class="text-right text-[11px] text-slate-400">
          <span id="wiki-rev-badge" class="font-bold text-teal-600">r3 판본</span>
        </div>
      </div>

      <!-- 색상 안내 가이드 -->
      <div class="flex items-center gap-2 text-[10px] bg-slate-50 p-2 rounded-lg text-slate-500">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span>노란색: 딴지금지 권한</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-400 inline-block"></span>붉은색: 공금지출 엄금</span>
      </div>

      <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-lg text-xs font-bold text-center">
        <button id="tab-view" class="py-1.5 bg-white text-slate-900 rounded shadow-sm">열람</button>
        <button id="tab-edit" class="py-1.5 text-slate-600 hover:text-slate-900 rounded">회칙 개정</button>
        <button id="tab-hist" class="py-1.5 text-slate-600 hover:text-slate-900 rounded">개정 역사</button>
      </div>
    </div>

    <!-- 1. [열람 패널] -->
    <div id="panel-view" class="space-y-3 text-xs leading-relaxed"></div>

    <!-- 2. [개정 패널] -->
    <div id="panel-edit" class="hidden bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="border-b pb-2 flex justify-between items-center">
        <h3 class="font-bold text-sm text-slate-900">회칙 조항 개정 편집창</h3>
        <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">수정 즉시 반영</span>
      </div>

      <div class="space-y-2 text-xs">
        <label class="block font-bold text-slate-700">개정 본문 텍스트 (조항별 자유 수정)</label>
        <textarea id="edit-content" rows="15" class="w-full p-2.5 border rounded-lg font-mono text-[11px] leading-relaxed bg-slate-50 focus:ring-2 focus:ring-teal-500"></textarea>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-700 mb-1">작업자 본인</label>
            <select id="edit-author" class="w-full p-2 border rounded-lg bg-white font-bold text-slate-800">
              <option value="김진세" selected>김진세</option>
              <option value="송환오">송환오</option>
              <option value="장우석">장우석</option>
              <option value="김정수">김정수</option>
              <option value="이해웅">이해웅</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-teal-900 mb-1">편집 요약 (개정 사유) *</label>
            <input type="text" id="edit-summary" placeholder="예: 제8조 식대 전용 조항 분리 반영" class="w-full p-2 border border-teal-300 rounded-lg focus:ring-2 focus:ring-teal-500 text-xs">
          </div>
        </div>

        <div class="flex gap-2 justify-end pt-2">
          <button type="button" id="btn-cancel-edit" class="px-3 py-1.5 border rounded font-semibold text-slate-600">취소</button>
          <button type="button" id="btn-save-edit" class="px-4 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded font-bold">개정안 저장 (새 판본 등록)</button>
        </div>
      </div>
    </div>

    <!-- 3. [역사 패널] -->
    <div id="panel-hist" class="hidden bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="border-b pb-2 flex justify-between items-center">
        <h3 class="font-bold text-sm text-slate-900">문서 개정 역사 (나무위키식)</h3>
        <span id="hist-count" class="text-[11px] text-slate-400">총 3개 판본</span>
      </div>

      <div id="hist-list-container" class="space-y-2 text-xs"></div>
    </div>

  </main>

  <script type="module">
    import { db } from "./js/firebase.js";
    import { doc, setDoc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 제8조와 제9조를 온전히 분리한 기본 표준 회칙 전문
    const defaultRuleText = `제1조 (명칭 및 목적)
본 모임은 고등학교 5인 동창 간의 친목 도모와 정기적인 회합, 상호 부조를 목적으로 2019년에 결성된 곗모임이다.

제2조 (회원의 자격 및 현황)
본 회의 정회원은 아래 5인으로 영구 한정한다.
• 김진세: 일반 회원 (기혼, 자녀 1명)
• 송환오: 회장 (기혼, 무자녀)
• 장우석: 총무 (기혼, 자녀 2명)
• 김정수: 일반 회원 (미혼)
• 이해웅: 일반 회원 (미혼)

제3조 (총무의 영구 면제권)
장우석 총무는 공금 관리 및 행정 업무를 상시 수행하는 대가로 차기 회장 피선거권에서 영구 면제된다.

제4조 (임기 및 탄핵 연동)
① 회장 임기는 대한민국 대통령 재임 기간과 일치한다.
② 대통령 탄핵 인용 시 회장직은 즉시 자동 박탈되며 비상 선출을 진행한다.
③ 차기 회장은 장우석 총무를 제외한 4인(송환오 현 회장 포함)을 대상으로 룰렛 추첨하며 확률은 각 25%로 균등하다. (연임 제한 없음)

제5조 (장소 독점권 및 딴지 금지)
정기·임시 모임의 장소 및 예약은 회장이 단독 결정한다. 모든 회원은 회장의 결정에 대해 일체의 불만이나 딴지를 제기할 수 없으며 오직 가족 참석 여부(RSVP)만 회신한다.

제6조 (가족 동반 및 수용 상한)
풀가동 시 최대 수용 규모는 성인 8명(회원 5 + 배우자 3)과 어린이 3명(장우석 2, 김진세 1)을 합산한 총 11명으로 산정하여 단독 프라이빗 룸을 예약한다.

제7조 (정기 회비 및 전환 규정)
① 월 정기 곗돈은 기혼자 월 80,000원, 미혼자 월 40,000원으로 차등 부과한다. (월 목표 320,000원)
② 미혼 회원이 결혼할 경우 익월부터 기혼자 요율(8만 원)로 자동 전환 적용된다.

제8조 (공금 통장 용도 제한: 식대 전용)
적립된 모임 공금 통장은 상·하반기 정기 모임 및 공식 모임의 식대, 다과비 결제에만 전액 사용하며, 개인 대여나 사적 유용은 일체 금지한다.

제9조 (경조사비 개별 각출 원칙)
회원의 결혼(50만 원), 첫돌(10만 원), 부고 등의 모든 경조사비는 공금 통장에서 지출하지 아니하고, 해당 당사자를 제외한 4인이 개별 각출하여 송금한다.

제10조 (편집 요약 의무제)
본 회칙을 개정할 때에는 개정 사유(편집 요약)를 필수로 입력해야만 판본으로 저장된다.`;

    let currentRuleText = defaultRuleText;

    let revisions = [
      { rev: "r3", date: "2026-09-07 00:00", author: "김진세", summary: "제8조 식대 전용 운영 및 제9조 경조사비 독립 분리 개정" },
      { rev: "r2", date: "2026-05-10 14:30", author: "장우석", summary: "경조사비 4인 개별 각출 원칙 명문화" },
      { rev: "r1", date: "2019-09-07 18:00", author: "송환오", summary: "5인 동창 곗모임 최초 회칙 제정" }
    ];

    // 드롭다운 제어
    const btnDropdown = document.getElementById("btn-dropdown");
    const dropdownMenu = document.getElementById("dropdown-menu");
    btnDropdown.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("hidden");
    });
    document.addEventListener("click", () => dropdownMenu.classList.add("hidden"));

    // [핵심] 조항 분리 및 색상별 카드 렌더링 함수
    function renderRuleText(rawText) {
      const container = document.getElementById("panel-view");
      container.innerHTML = "";

      if (!rawText || !rawText.trim()) {
        container.innerHTML = `<div class="p-6 text-center text-slate-400 bg-white rounded-xl border">등록된 회칙 내용이 없습니다.</div>`;
        return;
      }

      // '제X조' 단위로 정확히 분할 (제8조, 제9조 완벽 분리)
      const sections = rawText.split(/(?=제\s*[0-9]+조)/g).map(s => s.trim()).filter(Boolean);

      sections.forEach((sec, idx) => {
        const card = document.createElement("div");
        const firstLineEnd = sec.indexOf("\n");
        let title = sec;
        let body = "";

        if (firstLineEnd !== -1) {
          title = sec.substring(0, firstLineEnd).trim();
          body = sec.substring(firstLineEnd + 1).trim();
        }

        // 제5조(딴지금지): 노란색 / 제9조(경조사비 공금지출 엄금): 붉은색
        const isWarning = title.includes("5조") || title.includes("장소");
        const isDanger = title.includes("9조") || title.includes("경조사");

        let borderBg = "bg-white border-slate-200";
        let titleColor = "text-slate-900";
        let numColor = "text-teal-600";
        let bodyColor = "text-slate-600";

        if (isWarning) {
          borderBg = "bg-amber-50/70 border-amber-300";
          titleColor = "text-amber-950";
          numColor = "text-amber-600";
          bodyColor = "text-amber-900";
        } else if (isDanger) {
          borderBg = "bg-rose-50/70 border-rose-300";
          titleColor = "text-rose-950";
          numColor = "text-rose-600";
          bodyColor = "text-rose-900";
        }

        card.className = `${borderBg} border rounded-xl p-3.5 shadow-sm space-y-1.5`;
        card.innerHTML = `
          <strong class="${titleColor} text-sm flex items-center gap-1.5">
            <span class="${numColor} font-black">${idx + 1}.</span> ${title}
          </strong>
          <div class="${bodyColor} whitespace-pre-wrap leading-relaxed text-xs pt-0.5">${body}</div>
        `;
        container.appendChild(card);
      });
    }

    // 탭 전환
    const tabView = document.getElementById("tab-view");
    const tabEdit = document.getElementById("tab-edit");
    const tabHist = document.getElementById("tab-hist");
    const panelView = document.getElementById("panel-view");
    const panelEdit = document.getElementById("panel-edit");
    const panelHist = document.getElementById("panel-hist");

    function setTab(tab) {
      [tabView, tabEdit, tabHist].forEach(b => b.className = "py-1.5 text-slate-600 hover:text-slate-900 rounded");
      [panelView, panelEdit, panelHist].forEach(p => p.classList.add("hidden"));

      if (tab === "view") {
        tabView.className = "py-1.5 bg-white text-slate-900 rounded shadow-sm";
        panelView.classList.remove("hidden");
        renderRuleText(currentRuleText);
      } else if (tab === "edit") {
        tabEdit.className = "py-1.5 bg-white text-slate-900 rounded shadow-sm";
        panelEdit.classList.remove("hidden");
        document.getElementById("edit-content").value = currentRuleText;
      } else if (tab === "hist") {
        tabHist.className = "py-1.5 bg-white text-slate-900 rounded shadow-sm";
        panelHist.classList.remove("hidden");
        renderHistory();
      }
    }

    tabView.onclick = () => setTab("view");
    tabEdit.onclick = () => setTab("edit");
    tabHist.onclick = () => setTab("hist");
    document.getElementById("btn-cancel-edit").onclick = () => setTab("view");

    function renderHistory() {
      const container = document.getElementById("hist-list-container");
      container.innerHTML = "";
      revisions.forEach(r => {
        const div = document.createElement("div");
        div.className = "p-2.5 bg-slate-50 border rounded-lg flex justify-between items-center";
        div.innerHTML = `
          <div>
            <span class="font-bold text-teal-700">${r.rev}</span>
            <strong class="text-slate-800 ml-1">${r.author}</strong>
            <div class="text-[11px] text-slate-500 mt-0.5">${r.summary}</div>
          </div>
          <span class="text-[10px] text-slate-400 font-mono">${r.date}</span>
        `;
        container.appendChild(div);
      });
      document.getElementById("hist-count").innerText = `총 ${revisions.length}개 판본`;
      if (revisions.length > 0) {
        document.getElementById("wiki-rev-badge").innerText = `${revisions[0].rev} 판본`;
      }
    }

    // 개정안 저장
    document.getElementById("btn-save-edit").onclick = async () => {
      const newContent = document.getElementById("edit-content").value.trim();
      const summary = document.getElementById("edit-summary").value.trim();
      const author = document.getElementById("edit-author").value;

      if (!newContent) {
        alert("⚠️ 회칙 본문 내용이 비어있습니다.");
        return;
      }
      if (!summary) {
        alert("⚠️ [편집 요약 필수] 개정 사유(편집 요약)를 반드시 입력해야 합니다.");
        return document.getElementById("edit-summary").focus();
      }

      currentRuleText = newContent;
      localStorage.setItem("alumni_wiki_content", currentRuleText);

      const nextRev = `r${revisions.length + 1}`;
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      const newRec = { rev: nextRev, date: dateStr, author: author, summary: summary };
      revisions.unshift(newRec);
      localStorage.setItem("alumni_wiki_revs", JSON.stringify(revisions));

      renderRuleText(currentRuleText);
      document.getElementById("wiki-rev-badge").innerText = `${nextRev} 판본`;
      document.getElementById("edit-summary").value = "";

      setTab("view");
      alert(`🎉 [${author}] 개정안(${nextRev})이 열람 화면에 반영되었습니다.`);

      try {
        await setDoc(doc(db, "rule_content", "latest"), {
          content: currentRuleText,
          updatedAt: dateStr,
          author: author,
          rev: nextRev,
          summary: summary
        });
        await setDoc(doc(db, "rule_revisions", nextRev), newRec);
      } catch (err) {
        console.warn("DB 저장 에러(로컬 반영 완료):", err);
      }
    };

    // 초기 데이터 로드 (로컬스토리지 우선 로드 후 Firestore 동기화)
    async function loadWikiData() {
      // 로컬에 기존 8·9조 통합본이 저장되어 있을 수 있으므로 defaultRuleText 우선 적용
      const localContent = localStorage.getItem("alumni_wiki_content");
      if (localContent && localContent.includes("제8조 (공금 통장")) {
        currentRuleText = localContent;
      } else {
        currentRuleText = defaultRuleText;
        localStorage.setItem("alumni_wiki_content", defaultRuleText);
      }
      renderRuleText(currentRuleText);

      const localRevs = localStorage.getItem("alumni_wiki_revs");
      if (localRevs) {
        try { revisions = JSON.parse(localRevs); } catch(e){}
      }
      renderHistory();

      try {
        const contentSnap = await getDoc(doc(db, "rule_content", "latest"));
        if (contentSnap.exists()) {
          const data = contentSnap.data();
          if (data.content && data.content.includes("제8조 (공금 통장")) {
            currentRuleText = data.content;
            localStorage.setItem("alumni_wiki_content", currentRuleText);
            renderRuleText(currentRuleText);
          }
        }
      } catch(e) {}

      try {
        const revSnap = await getDocs(collection(db, "rule_revisions"));
        if (!revSnap.empty) {
          const list = [];
          revSnap.forEach(d => list.push(d.data()));
          list.sort((a, b) => b.rev.localeCompare(a.rev, undefined, { numeric: true }));
          revisions = list;
          localStorage.setItem("alumni_wiki_revs", JSON.stringify(list));
          renderHistory();
        }
      } catch(e) {}
    }

    loadWikiData();
  </script>

</body>
</html>
