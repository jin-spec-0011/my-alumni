<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>과거 여행 & 모임 - 5인 동창 곗모임</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-16 font-sans">

  <!-- 공통 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">📸</span>
        <div>
          <h1 class="font-black text-base text-slate-900 leading-tight">과거 여행 & 모임</h1>
          <span class="text-[10px] text-slate-400 font-medium">동창 추억 아카이브 (Since 2019)</span>
        </div>
      </div>
      <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">자율 참여 모드</span>
    </div>

    <!-- 5대 메인 탭 + 부가기능 콤보박스 -->
    <nav class="flex items-center justify-between border-t border-slate-100 mt-2.5 pt-2 text-xs">
      <div class="flex space-x-1 overflow-x-auto no-scrollbar font-bold">
        <a href="index.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">대시보드</a>
        <a href="history.html" class="py-1.5 px-2 bg-blue-50 text-blue-600 rounded-lg whitespace-nowrap">과거 여행</a>
        <a href="wiki.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회칙</a>
        <a href="settlement.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">개별 정산</a>
        <a href="election.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회장 선출</a>
      </div>

      <div class="relative inline-block text-left ml-1 flex-shrink-0">
        <button id="btn-dropdown" type="button" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg whitespace-nowrap flex items-center gap-1 border border-slate-200">
          <span>더보기 ▾</span>
        </button>
        <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-36 bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 z-50 text-xs font-semibold">
          <a href="gathering.html" class="block px-3 py-2 text-slate-700 hover:bg-slate-50 flex items-center gap-2">
            <i class="fa-solid fa-calendar-check text-blue-600 w-3.5"></i><span>모임 & 예약</span>
          </a>
          <a href="ledger.html" class="block px-3 py-2 text-slate-700 hover:bg-slate-50 flex items-center gap-2">
            <i class="fa-solid fa-won-sign text-amber-600 w-3.5"></i><span>회비 장부</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto p-4 space-y-4">

    <!-- 여행/모임 등록 & 수정 폼 -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="border-b pb-2 flex justify-between items-center">
        <div>
          <h2 class="font-bold text-sm text-slate-900" id="form-title">여행 / 모임 추억 등록</h2>
          <p class="text-[11px] text-slate-400">누구나 등록 및 수정 가능 (작업자 실명/시간 자동 기록)</p>
        </div>
        <button id="btn-cancel-edit" class="hidden text-xs text-rose-600 font-bold px-2 py-0.5 border border-rose-200 rounded">취소</button>
      </div>

      <form id="history-form" class="space-y-2.5 text-xs">
        <input type="hidden" id="edit-id" value="">

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-700 mb-1">여행지 / 장소</label>
            <input type="text" id="input-place" placeholder="예: 충북 한우 명가, 제주 여행" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">날짜</label>
            <input type="date" id="input-date" value="2026-09-07" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">메모 / 후기</label>
          <textarea id="input-memo" rows="2" placeholder="모임 이야기, 식당 후기 등을 자유롭게 작성하세요." class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <!-- 사진 첨부 (자동 400px 압축) -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">사진 첨부 (자동 최적화 압축)</label>
          <input type="file" id="input-photo" accept="image/*" class="w-full text-[11px] text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700">
          <div id="photo-preview-box" class="hidden mt-2 relative inline-block">
            <img id="photo-preview" class="w-24 h-24 object-cover rounded-lg border">
            <button type="button" id="btn-del-photo" class="absolute -top-1.5 -right-1.5 bg-rose-600 text-white rounded-full w-5 h-5 text-[10px] flex items-center justify-center">✕</button>
          </div>
        </div>

        <!-- 작업자 본인 선택 -->
        <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center">
          <span class="font-bold text-slate-700">작업자 (본인 이름)</span>
          <select id="select-author" class="p-1.5 border rounded bg-white font-bold text-slate-800">
            <option value="김진세" selected>김진세</option>
            <option value="송환오">송환오</option>
            <option value="장우석">장우석</option>
            <option value="김정수">김정수</option>
            <option value="이해웅">이해웅</option>
          </select>
        </div>

        <button type="submit" id="btn-submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm transition">
          추억 기록 저장
        </button>
      </form>
    </div>

    <!-- 연도 필터 -->
    <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm flex items-center justify-between text-xs">
      <span class="font-bold text-slate-600" id="record-count">총 0건</span>
      <div class="flex gap-1 overflow-x-auto no-scrollbar" id="year-filter-box">
        <button class="year-btn px-2.5 py-1 bg-slate-900 text-white rounded-lg font-bold" data-year="all">전체</button>
        <button class="year-btn px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg font-bold" data-year="2026">2026년</button>
        <button class="year-btn px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg font-bold" data-year="2025">2025년</button>
        <button class="year-btn px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg font-bold" data-year="2024">2024년</button>
        <button class="year-btn px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg font-bold" data-year="2019">2019년</button>
      </div>
    </div>

    <!-- 모임 카드 목록 -->
    <div id="history-cards-container" class="space-y-3 text-xs"></div>

  </main>

  <script type="module">
    import { db } from "./js/firebase.js";
    import { doc, setDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let historyList = [];
    let currentYearFilter = "all";
    let compressedPhotoBase64 = "";

    // 콤보박스 클릭 이벤트
    const btnDropdown = document.getElementById("btn-dropdown");
    const dropdownMenu = document.getElementById("dropdown-menu");
    btnDropdown.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("hidden");
    });
    document.addEventListener("click", () => dropdownMenu.classList.add("hidden"));

    // 사진 400px 압축
    document.getElementById("input-photo").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let w = img.width, h = img.height;
          const max = 400;
          if (w > max) { h = Math.round((h * max) / w); w = max; }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          compressedPhotoBase64 = canvas.toDataURL("image/jpeg", 0.6);
          document.getElementById("photo-preview").src = compressedPhotoBase64;
          document.getElementById("photo-preview-box").classList.remove("hidden");
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("btn-del-photo").onclick = () => {
      compressedPhotoBase64 = "";
      document.getElementById("input-photo").value = "";
      document.getElementById("photo-preview-box").classList.add("hidden");
    };

    function renderCards() {
      const container = document.getElementById("history-cards-container");
      container.innerHTML = "";

      const filtered = (currentYearFilter === "all")
        ? historyList
        : historyList.filter(item => String(item.date).startsWith(currentYearFilter));

      document.getElementById("record-count").innerText = `총 ${filtered.length}건`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-slate-400 bg-white rounded-xl border">등록된 모임 기록이 없습니다.</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-2.5";
        card.innerHTML = `
          <div class="flex justify-between items-start border-b pb-2">
            <div>
              <span class="text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded">${item.date.substring(0, 4)}년</span>
              <strong class="text-sm font-black text-slate-900 ml-1.5">${item.place}</strong>
            </div>
            <div class="flex gap-1.5">
              <button class="btn-edit text-[11px] text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-200 font-bold" data-id="${item.id}">수정</button>
              <button class="btn-del text-[11px] text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-200 font-bold" data-id="${item.id}">삭제</button>
            </div>
          </div>

          ${item.photo ? `<div><img src="${item.photo}" class="w-full max-h-48 object-cover rounded-lg border"></div>` : ''}

          <div class="space-y-1 text-slate-600 text-[11px]">
            <div>📅 <strong>일시:</strong> ${item.date}</div>
            ${item.memo ? `<div class="p-2 bg-slate-50 border rounded-lg text-slate-600 leading-relaxed">${item.memo}</div>` : ''}
          </div>

          <div class="text-[10px] text-slate-400 pt-1 border-t flex justify-between">
            <span>기록자: <strong>${item.author || '회원'}</strong></span>
            <span>${item.updatedAt || item.date}</span>
          </div>
        `;
        container.appendChild(card);
      });

      // 수정 이벤트
      document.querySelectorAll(".btn-edit").forEach(btn => {
        btn.onclick = (e) => {
          const id = e.currentTarget.getAttribute("data-id");
          const target = historyList.find(h => h.id === id);
          if (!target) return;

          document.getElementById("edit-id").value = target.id;
          document.getElementById("input-place").value = target.place;
          document.getElementById("input-date").value = target.date;
          document.getElementById("input-memo").value = target.memo || "";
          document.getElementById("select-author").value = target.author || "김진세";

          if (target.photo) {
            compressedPhotoBase64 = target.photo;
            document.getElementById("photo-preview").src = target.photo;
            document.getElementById("photo-preview-box").classList.remove("hidden");
          } else {
            compressedPhotoBase64 = "";
            document.getElementById("photo-preview-box").classList.add("hidden");
          }

          document.getElementById("form-title").innerText = "추억 기록 수정";
          document.getElementById("btn-submit").innerText = "수정 완료 (이력 갱신)";
          document.getElementById("btn-cancel-edit").classList.remove("hidden");
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      });

      // 삭제 이벤트
      document.querySelectorAll(".btn-del").forEach(btn => {
        btn.onclick = async (e) => {
          const id = e.currentTarget.getAttribute("data-id");
          const deleter = prompt("삭제자 본인 이름을 입력하세요 (김진세, 송환오, 장우석, 김정수, 이해웅):");
          if (!deleter) return;

          if (!confirm(`[${deleter}] 님이 이 기록을 영구 삭제하시겠습니까?`)) return;

          historyList = historyList.filter(h => h.id !== id);
          localStorage.setItem("alumni_history", JSON.stringify(historyList));
          renderCards();

          try {
            await deleteDoc(doc(db, "gatherings_history", id));
          } catch (err) {
            console.warn("DB 삭제 에러(로컬 삭제 완료):", err);
          }
          alert(`[${deleter}] 기록이 삭제되었습니다.`);
        };
      });
    }

    document.getElementById("btn-cancel-edit").onclick = () => {
      document.getElementById("edit-id").value = "";
      document.getElementById("form-title").innerText = "여행 / 모임 추억 등록";
      document.getElementById("btn-submit").innerText = "추억 기록 저장";
      document.getElementById("btn-cancel-edit").classList.add("hidden");
      document.getElementById("history-form").reset();
      compressedPhotoBase64 = "";
      document.getElementById("photo-preview-box").classList.add("hidden");
    };

    document.getElementById("history-form").onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById("edit-id").value || `hist_${Date.now()}`;
      const author = document.getElementById("select-author").value;
      const now = new Date();
      const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      const newRecord = {
        id,
        place: document.getElementById("input-place").value.trim(),
        date: document.getElementById("input-date").value,
        memo: document.getElementById("input-memo").value.trim(),
        photo: compressedPhotoBase64,
        author: author,
        updatedAt: timeStr
      };

      const idx = historyList.findIndex(h => h.id === id);
      if (idx > -1) historyList[idx] = newRecord;
      else historyList.unshift(newRecord);

      historyList.sort((a, b) => b.date.localeCompare(a.date));
      localStorage.setItem("alumni_history", JSON.stringify(historyList));
      renderCards();
      document.getElementById("btn-cancel-edit").click();

      try {
        await setDoc(doc(db, "gatherings_history", id), newRecord);
      } catch (err) {
        console.warn("DB 저장 에러(로컬 저장 완료):", err);
      }
      alert(`🎉 [${author}] 추억 기록이 저장되었습니다.`);
    };

    document.querySelectorAll(".year-btn").forEach(btn => {
      btn.onclick = (e) => {
        document.querySelectorAll(".year-btn").forEach(b => b.className = "year-btn px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg font-bold");
        e.currentTarget.className = "year-btn px-2.5 py-1 bg-slate-900 text-white rounded-lg font-bold";
        currentYearFilter = e.currentTarget.getAttribute("data-year");
        renderCards();
      };
    });

    async function loadData() {
      const local = localStorage.getItem("alumni_history");
      if (local) {
        try { historyList = JSON.parse(local); renderCards(); } catch(e){}
      }

      try {
        const snap = await getDocs(collection(db, "gatherings_history"));
        if (!snap.empty) {
          const list = [];
          snap.forEach(d => list.push(d.data()));
          list.sort((a, b) => b.date.localeCompare(a.date));
          historyList = list;
          localStorage.setItem("alumni_history", JSON.stringify(list));
        } else if (!local) {
          historyList = [
            { id: "hist_1", place: "충북 한우 명가", date: "2026-05-16", memo: "어른 8명 아이 3명 상반기 정기 모임", author: "송환오", updatedAt: "2026-05-16 20:00" },
            { id: "hist_2", place: "오창 호수공원 일식 다이닝", date: "2025-12-13", memo: "연말 정기 결산 가족 동반", author: "김진세", updatedAt: "2025-12-13 19:30" },
            { id: "hist_3", place: "모교 앞 고깃집 본점", date: "2019-09-07", memo: "5인 동창 곗모임 최초 결성식", author: "장우석", updatedAt: "2019-09-07 18:00" }
          ];
          for (const item of historyList) {
            await setDoc(doc(db, "gatherings_history", item.id), item);
          }
        }
      } catch (e) {
        console.warn("DB 로드 생략(로컬 모드 유지):", e);
      }
      renderCards();
    }

    loadData();
  </script>

</body>
</html>
