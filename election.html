<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5인 동창 곗모임</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-16 font-sans">

  <!-- 상단 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🎓</span>
        <div>
          <h1 class="font-black text-base text-slate-900 leading-tight">5인 동창 곗모임</h1>
          <span class="text-[10px] text-slate-400 font-medium">Since 2019 (8년차)</span>
        </div>
      </div>

      <!-- 접속자 스위처 -->
      <select id="current-user-select" class="text-xs bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 font-semibold text-slate-700">
        <option value="user_kim_js" selected>⚙️ 김진세 (관리자)</option>
        <option value="user_song">👑 송환오 (회장)</option>
        <option value="user_jang">🛡️ 장우석 (총무)</option>
        <option value="user_kim_jungsoo">김정수 (회원)</option>
        <option value="user_lee">이해웅 (회원)</option>
      </select>
    </div>

    <!-- 권한 연동 탭 메뉴 -->
    <nav class="flex space-x-1 border-t border-slate-100 mt-2.5 pt-2 overflow-x-auto text-xs no-scrollbar">
      <a href="index.html" class="py-1.5 px-3 bg-blue-50 text-blue-600 font-bold rounded-lg whitespace-nowrap">대시보드</a>
      <a href="history.html" class="py-1.5 px-3 text-slate-600 font-medium rounded-lg whitespace-nowrap">과거 여행/모임</a>
      <a href="wiki.html" class="py-1.5 px-3 text-slate-600 font-medium rounded-lg whitespace-nowrap">회칙</a>
      <!-- 관리자 전용 메뉴 -->
      <a href="settlement.html" class="admin-only py-1.5 px-3 text-slate-600 font-medium rounded-lg whitespace-nowrap">개별 정산</a>
      <a href="election.html" class="admin-only py-1.5 px-3 text-slate-600 font-medium rounded-lg whitespace-nowrap">회장 선출</a>
    </nav>
  </header>

  <!-- 메인 모바일 뷰 (공금 잔액 제거) -->
  <main class="flex-1 w-full max-w-md mx-auto p-4 space-y-4">

    <!-- 송환오 회장 및 대통령 임기 D-day 카드 -->
    <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white rounded-2xl p-5 shadow-sm space-y-3">
      <div class="flex justify-between items-center text-xs">
        <span class="bg-amber-400 text-slate-950 font-black px-2 py-0.5 rounded text-[10px]">CURRENT LEADER</span>
        <span class="text-slate-400 text-[11px]">임기 연동제</span>
      </div>
      <div>
        <h2 class="text-xl font-black">👑 송환오 회장</h2>
        <p class="text-xs text-slate-300 mt-1">모임 장소 및 예약 전권 단독 행사 (회칙 제5조: 딴지 불가)</p>
      </div>
      <div class="pt-2 border-t border-white/10 flex justify-between items-center text-xs">
        <span class="text-slate-400">대통령 임기 만료까지</span>
        <span id="president-dday" class="text-base font-black text-amber-300">D-계산중</span>
      </div>
    </div>

    <!-- 빠른 바로가기 2구리드 -->
    <div class="grid grid-cols-2 gap-2 text-xs">
      <a href="history.html" class="p-3.5 bg-white border border-slate-200 rounded-xl shadow-sm hover:bg-slate-50 transition block space-y-1">
        <i class="fa-solid fa-map-location-dot text-lg text-emerald-600"></i>
        <div class="font-bold text-slate-800">과거 여행/모임</div>
        <div class="text-[11px] text-slate-400">2019년부터 연도별 기록</div>
      </a>
      <a href="wiki.html" class="p-3.5 bg-white border border-slate-200 rounded-xl shadow-sm hover:bg-slate-50 transition block space-y-1">
        <i class="fa-solid fa-book text-lg text-blue-600"></i>
        <div class="font-bold text-slate-800">모임 합의 회칙</div>
        <div class="text-[11px] text-slate-400">규정 및 판본 역사 열람</div>
      </a>
    </div>

    <!-- 5인 회원 프로필 현황 -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="border-b pb-2 flex justify-between items-center">
        <h3 class="font-bold text-sm text-slate-900 flex items-center gap-1.5">
          <i class="fa-solid fa-users text-slate-600"></i>
          <span>동창 5인 현황</span>
        </h3>
        <span class="text-[11px] text-slate-400">창립 2019년 (정원 5인)</span>
      </div>

      <div class="space-y-2 text-xs" id="member-list">
        <!-- 5인 명단 -->
        <div class="flex justify-between items-center p-2.5 bg-slate-50 rounded-lg">
          <div>
            <strong class="text-slate-900">김진세</strong>
            <span class="text-[10px] bg-slate-800 text-white px-1.5 py-0.5 rounded font-bold ml-1">관리자</span>
          </div>
          <span class="text-slate-500">기혼 (자녀 1명)</span>
        </div>
        <div class="flex justify-between items-center p-2.5 bg-slate-50 rounded-lg">
          <div>
            <strong class="text-slate-900">송환오</strong>
            <span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold ml-1">회장</span>
          </div>
          <span class="text-slate-500">기혼 (무자녀)</span>
        </div>
        <div class="flex justify-between items-center p-2.5 bg-slate-50 rounded-lg">
          <div>
            <strong class="text-slate-900">장우석</strong>
            <span class="text-[10px] bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold ml-1">총무</span>
          </div>
          <span class="text-slate-500">기혼 (자녀 2명)</span>
        </div>
        <div class="flex justify-between items-center p-2.5 bg-slate-50 rounded-lg">
          <div>
            <strong class="text-slate-900">김정수</strong>
            <span class="text-[10px] text-slate-400 ml-1">회원</span>
          </div>
          <span class="text-slate-500">미혼</span>
        </div>
        <div class="flex justify-between items-center p-2.5 bg-slate-50 rounded-lg">
          <div>
            <strong class="text-slate-900">이해웅</strong>
            <span class="text-[10px] text-slate-400 ml-1">회원</span>
          </div>
          <span class="text-slate-500">미혼</span>
        </div>
      </div>
    </div>

  </main>

  <script type="module">
    const currentUserSelect = document.getElementById("current-user-select");

    // 권한별 메뉴 가시성 제어 (김진세 외에는 정산, 선출 숨김)
    function updateMenuVisibility() {
      const isAdmin = (currentUserSelect.value === "user_kim_js");
      document.querySelectorAll(".admin-only").forEach(el => {
        if (isAdmin) el.classList.remove("hidden");
        else el.classList.add("hidden");
      });
    }

    // 대통령 시계
    function updateCountdown() {
      const diff = new Date("2027-05-10T00:00:00+09:00").getTime() - Date.now();
      const el = document.getElementById("president-dday");
      if (diff <= 0) el.innerText = "임기만료";
      else el.innerText = `D-${Math.floor(diff / (1000 * 60 * 60 * 24))}일`;
    }

    currentUserSelect.addEventListener("change", updateMenuVisibility);
    updateMenuVisibility();
    updateCountdown();
  </script>

</body>
</html>
