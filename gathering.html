<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>모임 공표 - 5인 동창 곗모임</title>

  <!-- PWA & 모바일 웹앱 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="5인곗모임">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-16 font-sans">

  <!-- 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">📢</span>
        <div>
          <h1 class="font-black text-base text-slate-900 leading-tight">회장 모임 공표</h1>
          <span class="text-[10px] text-slate-400 font-medium">회칙 제5조: 회장 단독 장소 독점권</span>
        </div>
      </div>
      <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200">
        <i class="fa-solid fa-crown mr-1"></i>회장 전권
      </span>
    </div>

    <!-- 네비게이션 -->
    <nav class="flex items-center justify-between border-t border-slate-100 mt-2.5 pt-2 text-xs">
      <div class="flex space-x-1 overflow-x-auto no-scrollbar font-bold">
        <a href="index.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">대시보드</a>
        <a href="history.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">과거 여행</a>
        <a href="wiki.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회칙</a>
        <a href="settlement.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">개별 정산</a>
        <a href="election.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회장 선출</a>
      </div>

      <div class="relative inline-block text-left ml-1 flex-shrink-0">
        <button id="btn-dropdown" type="button" class="py-1.5 px-2 bg-blue-50 text-blue-600 font-bold rounded-lg whitespace-nowrap flex items-center gap-1 border border-blue-200">
          <span>더보기 ▾</span>
        </button>
        <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-36 bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 z-50 text-xs font-semibold">
          <a href="gathering.html" class="block px-3 py-2 text-blue-600 bg-blue-50/50 flex items-center gap-2">
            <i class="fa-solid fa-bullhorn text-amber-600 w-3.5"></i><span>모임 공표</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto p-4 space-y-4">

    <!-- 현재 확정 공표 현황 카드 -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-bullhorn text-amber-600"></i>
          <h2 class="font-bold text-sm text-slate-900">현재 확정 공표 안내</h2>
        </div>
        <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">공식 확정</span>
      </div>

      <table class="w-full text-xs text-left border-collapse">
        <tbody class="divide-y divide-slate-100">
          <tr>
            <th class="py-2.5 px-2 bg-slate-50 font-bold text-slate-600 w-24 rounded-l">확정 장소</th>
            <td class="py-2.5 px-3 font-black text-slate-900" id="view-place-name">로딩 중...</td>
          </tr>
          <tr>
            <th class="py-2.5 px-2 bg-slate-50 font-bold text-slate-600">모임 일시</th>
            <td class="py-2.5 px-3 font-semibold text-slate-800" id="view-meeting-date">로딩 중...</td>
          </tr>
          <tr>
            <th class="py-2.5 px-2 bg-slate-50 font-bold text-slate-600">참석 규모</th>
            <td class="py-2.5 px-3 text-slate-700">
              <!-- (풀가동) 제거 -->
              <strong class="text-blue-600 font-bold" id="view-capacity-total">총 0명</strong>
              <div class="text-[10px] text-slate-400 mt-0.5" id="view-capacity-detail">성인 0명 + 어린이 0명</div>
            </td>
          </tr>
          <tr>
            <th class="py-2.5 px-2 bg-slate-50 font-bold text-slate-600 align-top pt-2.5 rounded-l">회장 지침</th>
            <td class="py-2.5 px-3 text-[11px] text-slate-700 leading-relaxed font-sans" id="view-meeting-note">
              로딩 중...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 모임 공표 및 회장 지침 수정 폼 -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="border-b pb-2 flex justify-between items-center">
        <div>
          <h3 class="font-bold text-sm text-slate-900 flex items-center gap-1.5">
            <i class="fa-solid fa-pen-to-square text-blue-600"></i>
            <span>모임 정보 & 지침 수정</span>
          </h3>
          <p class="text-[10px] text-slate-400 mt-0.5">회장의 장소 지정 및 공지 지침을 직접 작성합니다.</p>
        </div>
      </div>

      <form id="gathering-form" class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">확정 모임 장소 (식당/장소명)</label>
          <input type="text" id="input-place" placeholder="예: 충북 한우 명가 (단독 룸)" required
                 class="w-full p-2.5 border rounded-lg font-bold text-slate-900 focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">모임 일시</label>
          <input type="datetime-local" id="input-datetime" required
                 class="w-full p-2.5 border rounded-lg font-bold text-slate-900 focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">회장 특별 지침 (미작성 시 "조심히 오세요.")</label>
          <textarea id="input-note" rows="3" placeholder="지침을 비워두면 자동으로 '조심히 오세요.'가 적용됩니다."
                    class="w-full p-2.5 border rounded-lg text-xs leading-relaxed text-slate-800 focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <button type="submit" id="btn-save-gathering" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow transition">
          모임 공표 및 지침 저장 (대시보드 즉시 반영)
        </button>
      </form>
    </div>

  </main>

  <script type="module">
    import { db } from "./js/firebase.js";
    import { 
      doc, 
      setDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 드롭다운 메뉴
    const btnDropdown = document.getElementById("btn-dropdown");
    const dropdownMenu = document.getElementById("dropdown-menu");
    btnDropdown.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("hidden");
    });
    document.addEventListener("click", () => dropdownMenu.classList.add("hidden"));

    // 참석 규모 실시간 계산 ((풀가동) 단어 제외)
    try {
      onSnapshot(doc(db, "app_state", "members_status"), (docSnap) => {
        if (docSnap.exists() && docSnap.data().list) {
          const members = docSnap.data().list;
          let adultCount = 5;
          let childCount = 0;
          members.forEach(m => {
            if (m.marital === "married") adultCount += 1;
            childCount += Number(m.children) || 0;
          });
          const totalCount = adultCount + childCount;
          // (풀가동) 제거된 깔끔한 표기
          document.getElementById("view-capacity-total").innerText = `총 ${totalCount}명`;
          document.getElementById("view-capacity-detail").innerText = `성인 ${adultCount}명 + 어린이 ${childCount}명`;
        }
      });
    } catch(e) {
      console.error(e);
    }

    // 모임 정보 실시간 구독 및 폼에 기존값 채우기
    try {
      onSnapshot(doc(db, "gathering", "latest"), (docSnap) => {
        if (docSnap.exists()) {
          const g = docSnap.data();
          const place = g.placeName || "미정";
          // 미작성 시 "조심히 오세요." 기본값
          const note = (g.note && g.note.trim().length > 0) ? g.note.trim() : "조심히 오세요.";

          document.getElementById("view-place-name").innerText = place;
          document.getElementById("view-meeting-note").innerText = note;

          if (g.dateStr) {
            const d = new Date(g.dateStr);
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            document.getElementById("view-meeting-date").innerText = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} (${days[d.getDay()]}) ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            
            // 폼 입력창에 채워넣기
            const localIso = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
            document.getElementById("input-datetime").value = localIso;
          }

          document.getElementById("input-place").value = g.placeName || "";
          document.getElementById("input-note").value = (g.note && g.note.trim().length > 0) ? g.note : "";
        }
      });
    } catch(e) {
      console.error(e);
    }

    // 모임 공표 폼 저장 처리
    document.getElementById("gathering-form").onsubmit = async (e) => {
      e.preventDefault();
      const placeName = document.getElementById("input-place").value.trim();
      const dateStr = document.getElementById("input-datetime").value;
      let note = document.getElementById("input-note").value.trim();

      // [핵심] 미작성 시 "조심히 오세요." 자동 대체
      if (!note) {
        note = "조심히 오세요.";
      }

      const btn = document.getElementById("btn-save-gathering");
      btn.disabled = true;
      btn.innerText = "저장 중...";

      try {
        await setDoc(doc(db, "gathering", "latest"), {
          placeName,
          dateStr,
          note,
          updatedAt: new Date().toISOString()
        });

        alert(`🎉 모임 정보와 지침이 저장되었습니다!\n\n• 장소: ${placeName}\n• 지침: "${note}"`);
      } catch (err) {
        alert(`❌ 저장 실패: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerText = "모임 공표 및 지침 저장 (대시보드 즉시 반영)";
      }
    };
  </script>

</body>
</html>
