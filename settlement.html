<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>개별 정산 - 5인 동창 곗모임</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-16 font-sans">

  <!-- 공통 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🧾</span>
        <div>
          <h1 class="font-black text-base text-slate-900 leading-tight">모임 개별 정산소</h1>
          <span class="text-[10px] text-slate-400 font-medium">모임별 & 개인별 실비 정산</span>
        </div>
      </div>
      <span id="sync-badge" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
        <i class="fa-solid fa-rotate mr-1"></i>실시간 동기화
      </span>
    </div>

    <!-- 5대 메인 탭 + 부가기능 콤보박스 -->
    <nav class="flex items-center justify-between border-t border-slate-100 mt-2.5 pt-2 text-xs">
      <div class="flex space-x-1 overflow-x-auto no-scrollbar font-bold">
        <a href="index.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">대시보드</a>
        <a href="history.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">과거 여행</a>
        <a href="wiki.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회칙</a>
        <a href="settlement.html" class="py-1.5 px-2 bg-blue-50 text-blue-600 rounded-lg whitespace-nowrap">개별 정산</a>
        <a href="election.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회장 선출</a>
      </div>

      <div class="relative inline-block text-left ml-1 flex-shrink-0">
        <button id="btn-dropdown" type="button" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg whitespace-nowrap flex items-center gap-1 border border-slate-200">
          <span>더보기 ▾</span>
        </button>
        <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-36 bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 z-50 text-xs font-semibold">
          <a href="gathering.html" class="block px-3 py-2 text-slate-700 hover:bg-slate-50 flex items-center gap-2">
            <i class="fa-solid fa-calendar-check text-blue-600 w-3.5"></i><span>모임 & 예약</span>
          </a>
          <a href="ledger.html" class="block px-3 py-2 text-slate-700 hover:bg-slate-50 flex items-center gap-2">
            <i class="fa-solid fa-won-sign text-amber-600 w-3.5"></i><span>회비 장부</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto p-4 space-y-4">

    <!-- 실시간 합산 대시보드 -->
    <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white rounded-2xl p-4 shadow-sm space-y-3">
      <div class="flex justify-between items-center text-xs">
        <span class="text-amber-300 font-bold flex items-center gap-1">
          <i class="fa-solid fa-chart-pie"></i> 실시간 지출 합산 집계
        </span>
        <span class="text-slate-300 font-bold text-xs" id="stat-total-grand">총 0원</span>
      </div>

      <!-- 회원별 합산 -->
      <div class="space-y-1">
        <span class="text-[10px] text-slate-400 block font-semibold">👥 5인 회원별 지출 합산</span>
        <div class="grid grid-cols-5 gap-1 text-center" id="stat-by-person"></div>
      </div>

      <!-- 모임 구분별 합산 -->
      <div class="pt-2 border-t border-white/10 space-y-1">
        <span class="text-[10px] text-slate-400 block font-semibold">📅 모임 구분별 합계</span>
        <div class="flex gap-1.5 overflow-x-auto no-scrollbar text-xs" id="stat-by-period"></div>
      </div>
    </div>

    <!-- 정산 등록 / 수정 폼 -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="border-b pb-2 flex justify-between items-center">
        <div>
          <h2 class="font-bold text-sm text-slate-900" id="form-title">정산 내역 등록</h2>
          <p class="text-[11px] text-slate-400">교통비, 식비 등 지출 실비를 등록합니다.</p>
        </div>
        <button id="btn-cancel-edit" class="hidden text-xs text-rose-600 font-bold px-2 py-0.5 border border-rose-200 rounded">취소</button>
      </div>

      <form id="settlement-form" class="space-y-2.5 text-xs">
        <input type="hidden" id="edit-id" value="">

        <!-- 모임 구분 (연도 선택 탭 기본 탑재: 2021년~2031년) -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">모임 구분 (연도 및 모임 선택)</label>
          <div class="grid grid-cols-2 gap-2">
            <select id="select-year" class="p-2 border rounded-lg bg-white font-bold text-slate-800">
              <option value="2021년">2021년</option>
              <option value="2022년">2022년</option>
              <option value="2023년">2023년</option>
              <option value="2024년">2024년</option>
              <option value="2025년">2025년</option>
              <option value="2026년" selected>2026년</option>
              <option value="2027년">2027년</option>
              <option value="2028년">2028년</option>
              <option value="2029년">2029년</option>
              <option value="2030년">2030년</option>
              <option value="2031년">2031년</option>
            </select>
            <select id="select-term" class="p-2 border rounded-lg bg-white font-bold text-slate-800">
              <option value="하반기 정기 모임" selected>하반기 정기 모임</option>
              <option value="상반기 정기 모임">상반기 정기 모임</option>
              <option value="임시 번개 모임">임시 번개 모임</option>
              <option value="가족 나들이 여행">가족 나들이 여행</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-700 mb-1">지출자 본인</label>
            <select id="input-name" class="w-full p-2 border rounded-lg bg-white font-bold text-slate-800">
              <option value="김진세" selected>김진세</option>
              <option value="송환오">송환오</option>
              <option value="장우석">장우석</option>
              <option value="김정수">김정수</option>
              <option value="이해웅">이해웅</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">금액 (원)</label>
            <input type="number" id="input-amount" placeholder="예: 44000" step="100" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 font-bold">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">내역 / 사용처</label>
          <input type="text" id="input-detail" placeholder="예: 교통비 40000원, 식비 4000원" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- 작업자 확인 (지출자와 자동 연동) -->
        <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center">
          <div>
            <span class="font-bold text-slate-700">작업자 확인</span>
            <span class="text-[10px] text-slate-400 block">지출자와 자동 연동</span>
          </div>
          <select id="select-operator" class="p-1.5 border rounded bg-white font-bold text-slate-800">
            <option value="김진세" selected>김진세</option>
            <option value="송환오">송환오</option>
            <option value="장우석">장우석</option>
            <option value="김정수">김정수</option>
            <option value="이해웅">이해웅</option>
          </select>
        </div>

        <button type="submit" id="btn-submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm transition">
          정산 내역 저장
        </button>
      </form>
    </div>

    <!-- 정산 목록 -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="border-b pb-2 flex justify-between items-center">
        <h3 class="font-bold text-sm text-slate-900">전체 정산 목록 (실시간 연동)</h3>
        <span class="text-[11px] text-slate-400" id="list-count">총 0건</span>
      </div>

      <div id="settlement-cards-container" class="space-y-2 text-xs">
        <div class="p-6 text-center text-slate-400">데이터를 실시간 동기화 중...</div>
      </div>
    </div>

  </main>

  <!-- 안정적인 구글 공식 CDN 임포트 -->
  <script type="module">
    import { db } from "./js/firebase.js";
    import { 
      doc, 
      setDoc, 
      deleteDoc, 
      collection, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let settlements = [];

    // 드롭다운 토글
    const btnDropdown = document.getElementById("btn-dropdown");
    const dropdownMenu = document.getElementById("dropdown-menu");
    btnDropdown.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("hidden");
    });
    document.addEventListener("click", () => dropdownMenu.classList.add("hidden"));

    // 지출자 변경 시 작업자 자동 동기화
    const inputName = document.getElementById("input-name");
    const selectOperator = document.getElementById("select-operator");
    inputName.addEventListener("change", () => {
      selectOperator.value = inputName.value;
    });

    function updateAggregations() {
      let grandTotal = 0;
      const byPerson = { "김진세": 0, "송환오": 0, "장우석": 0, "김정수": 0, "이해웅": 0 };
      const byPeriod = {};

      settlements.forEach(item => {
        const amt = Number(item.amount) || 0;
        grandTotal += amt;
        if (byPerson[item.name] !== undefined) byPerson[item.name] += amt;
        else byPerson[item.name] = amt;

        byPeriod[item.period] = (byPeriod[item.period] || 0) + amt;
      });

      document.getElementById("stat-total-grand").innerText = `총 ${grandTotal.toLocaleString()}원`;

      const personBox = document.getElementById("stat-by-person");
      personBox.innerHTML = "";
      Object.keys(byPerson).forEach(name => {
        const div = document.createElement("div");
        div.className = "bg-white/10 p-1.5 rounded-lg";
        div.innerHTML = `
          <div class="text-[10px] text-slate-300 font-bold">${name}</div>
          <div class="text-[11px] font-black text-amber-300">${byPerson[name].toLocaleString()}</div>
        `;
        personBox.appendChild(div);
      });

      const periodBox = document.getElementById("stat-by-period");
      periodBox.innerHTML = "";
      Object.keys(byPeriod).forEach(p => {
        const div = document.createElement("div");
        div.className = "bg-white/10 px-2 py-1 rounded text-[11px] whitespace-nowrap";
        div.innerHTML = `<strong>${p}:</strong> <span class="text-emerald-400 font-black">${byPeriod[p].toLocaleString()}원</span>`;
        periodBox.appendChild(div);
      });
    }

    function renderList() {
      const container = document.getElementById("settlement-cards-container");
      container.innerHTML = "";

      document.getElementById("list-count").innerText = `총 ${settlements.length}건`;

      if (settlements.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-slate-400 bg-slate-50 rounded-xl border">등록된 정산 내역이 없습니다.</div>`;
        updateAggregations();
        return;
      }

      settlements.forEach(item => {
        const card = document.createElement("div");
        card.className = "p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1.5";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-bold">${item.period}</span>
              <strong class="text-slate-900 text-sm ml-1">${item.name}</strong>
            </div>
            <div class="flex gap-1.5">
              <button class="btn-edit text-[11px] text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-200 font-bold" data-id="${item.id}">수정</button>
              <button class="btn-del text-[11px] text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-200 font-bold" data-id="${item.id}">삭제</button>
            </div>
          </div>

          <div class="flex justify-between items-center text-xs pt-1">
            <span class="text-slate-700 font-medium">${item.detail}</span>
            <span class="font-black text-emerald-700 text-sm">${Number(item.amount).toLocaleString()}원</span>
          </div>

          <div class="text-[10px] text-slate-400 pt-1 border-t flex justify-between">
            <span>작업자: <strong>${item.operator || item.name}</strong></span>
            <span>${item.updatedAt || '-'}</span>
          </div>
        `;
        container.appendChild(card);
      });

      // 수정 버튼
      document.querySelectorAll(".btn-edit").forEach(btn => {
        btn.onclick = (e) => {
          const id = e.currentTarget.getAttribute("data-id");
          const target = settlements.find(s => s.id === id);
          if (!target) return;

          document.getElementById("edit-id").value = target.id;
          inputName.value = target.name;
          selectOperator.value = target.operator || target.name;
          document.getElementById("input-amount").value = target.amount;
          document.getElementById("input-detail").value = target.detail;

          document.getElementById("form-title").innerText = "정산 내역 수정";
          document.getElementById("btn-submit").innerText = "수정 완료 (클라우드 반영)";
          document.getElementById("btn-cancel-edit").classList.remove("hidden");
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      });

      // 삭제 버튼
      document.querySelectorAll(".btn-del").forEach(btn => {
        btn.onclick = async (e) => {
          const id = e.currentTarget.getAttribute("data-id");
          const deleter = prompt("삭제자 본인 이름을 입력하세요 (김진세, 송환오, 장우석, 김정수, 이해웅):");
          if (!deleter) return;

          if (!confirm(`[${deleter}] 님이 이 정산 건을 클라우드 DB에서 삭제하시겠습니까?`)) return;

          try {
            await deleteDoc(doc(db, "settlements", id));
            alert(`[${deleter}] 삭제되었습니다.`);
          } catch(err) {
            alert(`❌ 삭제 실패: ${err.message}`);
          }
        };
      });

      updateAggregations();
    }

    // 취소 버튼
    document.getElementById("btn-cancel-edit").onclick = () => {
      document.getElementById("edit-id").value = "";
      document.getElementById("form-title").innerText = "정산 내역 등록";
      document.getElementById("btn-submit").innerText = "정산 내역 저장";
      document.getElementById("btn-cancel-edit").classList.add("hidden");
      document.getElementById("settlement-form").reset();
      document.getElementById("select-year").value = "2026년";
    };

    // 정산 등록 폼 전송
    document.getElementById("settlement-form").onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById("edit-id").value || `set_${Date.now()}`;
      const year = document.getElementById("select-year").value;
      const term = document.getElementById("select-term").value;
      const period = `${year} ${term}`;
      const name = inputName.value;
      const operator = selectOperator.value;
      const now = new Date();
      const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      const newRecord = {
        id,
        period: period,
        name: name,
        amount: parseInt(document.getElementById("input-amount").value, 10) || 0,
        detail: document.getElementById("input-detail").value.trim(),
        operator: operator,
        updatedAt: timeStr
      };

      try {
        await setDoc(doc(db, "settlements", id), newRecord);
        alert(`🎉 [${operator}] 정산 내역이 성공적으로 저장되었습니다!`);
        document.getElementById("btn-cancel-edit").click();
      } catch (err) {
        alert(`❌ 클라우드 저장 실패! Firebase 콘솔에서 규칙을 확인하세요:\n${err.message}`);
      }
    };

    // 실시간 Firestore 리스너 (onSnapshot)
    try {
      onSnapshot(collection(db, "settlements"), (snapshot) => {
        const list = [];
        snapshot.forEach(d => list.push(d.data()));
        list.sort((a, b) => b.id.localeCompare(a.id));
        settlements = list;
        renderList();
      }, (error) => {
        console.error("Firestore 구독 에러:", error);
        document.getElementById("sync-badge").className = "text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200";
        document.getElementById("sync-badge").innerText = "⚠️ DB 연결 차단됨";
      });
    } catch (e) {
      console.error(e);
    }
  </script>

</body>
</html>
