<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>개별 정산 - 5인 동창 곗모임</title>

  <!-- PWA & 단독 웹앱 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="5인곗모임">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-16 font-sans">

  <!-- 공통 상단 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🧮</span>
        <div>
          <h1 class="font-black text-base text-slate-900 leading-tight">개별 정산 계산기</h1>
          <span class="text-[10px] text-slate-400 font-medium">1원 단위 정밀 N분의 1 정산</span>
        </div>
      </div>
      <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">
        <i class="fa-solid fa-coins mr-1"></i>1원 단위 지원
      </span>
    </div>

    <!-- 5대 메인 탭 네비게이션 -->
    <nav class="flex items-center justify-between border-t border-slate-100 mt-2.5 pt-2 text-xs">
      <div class="flex space-x-1 overflow-x-auto no-scrollbar font-bold">
        <a href="index.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">대시보드</a>
        <a href="history.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">과거 여행</a>
        <a href="wiki.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회칙</a>
        <a href="settlement.html" class="py-1.5 px-2 bg-blue-50 text-blue-600 rounded-lg whitespace-nowrap">개별 정산</a>
        <a href="election.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회장 선출</a>
      </div>

      <div class="relative inline-block text-left ml-1 flex-shrink-0">
        <button id="btn-dropdown" type="button" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg whitespace-nowrap flex items-center gap-1 border border-slate-200">
          <span>더보기 ▾</span>
        </button>
        <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-36 bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 z-50 text-xs font-semibold">
          <a href="gathering.html" class="block px-3 py-2 text-slate-700 hover:bg-slate-50 flex items-center gap-2">
            <i class="fa-solid fa-bullhorn text-amber-600 w-3.5"></i><span>모임 공표</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto p-4 space-y-4">

    <!-- 정산 금액 입력 카드 -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="border-b pb-2 flex justify-between items-center">
        <h2 class="font-black text-sm text-slate-900 flex items-center gap-1.5">
          <i class="fa-solid fa-receipt text-blue-600"></i>
          <span>정산 금액 입력</span>
        </h2>
        <span class="text-[10px] text-slate-400">식대/추가경비 개별 각출</span>
      </div>

      <div class="space-y-2.5 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">총 결제 금액 (1원 단위)</label>
          <div class="relative">
            <input type="number" id="input-total-amount" step="1" min="0" placeholder="예: 187350"
                   class="w-full p-2.5 pl-3 pr-8 border rounded-lg font-mono font-bold text-slate-900 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <span class="absolute right-3 top-2.5 font-bold text-slate-400 text-xs">원</span>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">모임/정산 명목</label>
          <input type="text" id="input-settle-title" placeholder="예: 2026 하반기 정기 모임 2차 호프 식대"
                 class="w-full p-2.5 border rounded-lg font-medium text-slate-800 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">선결제자 (입금받을 계좌 주인)</label>
          <select id="select-payer" class="w-full p-2.5 border rounded-lg bg-slate-50 font-bold text-slate-800 text-xs">
            <option value="장우석">장우석 (총무)</option>
            <option value="송환오">송환오</option>
            <option value="김진세">김진세</option>
            <option value="김정수">김정수</option>
            <option value="이해웅">이해웅</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 정산 참여 대상자 선택 (체크박스) -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm text-slate-900 flex items-center gap-1.5">
          <i class="fa-solid fa-users text-slate-600"></i>
          <span>정산 참여 인원</span>
        </h3>
        <span class="text-[11px] font-bold text-blue-600" id="participant-count-text">5명 선택됨</span>
      </div>

      <div class="grid grid-cols-1 gap-2 text-xs" id="participants-container">
        <!-- JS 동적 렌더링 -->
      </div>
    </div>

    <!-- 계산 결과 카드 -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm text-slate-900">정산 계산 결과</h3>
        <span class="text-[10px] bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded border border-emerald-200">
          오차 0원 검증 완료
        </span>
      </div>

      <div class="p-3 bg-slate-50 rounded-xl space-y-1.5 text-xs">
        <div class="flex justify-between items-center text-slate-600">
          <span>기본 1인당 배부액:</span>
          <span class="font-bold font-mono text-slate-900" id="res-base-amount">0원</span>
        </div>
        <div class="flex justify-between items-center text-slate-600">
          <span>자투리 잔여액(1원 단위):</span>
          <span class="font-bold font-mono text-amber-600" id="res-remainder-amount">0원</span>
        </div>
        <div class="text-[10px] text-slate-400 pt-1 border-t border-slate-200">
          * N등분 후 남은 자투리 1원은 선결제자/첫 번째 정산 인원에게 공평하게 귀속되어 1원의 오차도 없습니다.
        </div>
      </div>

      <!-- 멤버별 실 청구액 목록 -->
      <div class="space-y-1.5 text-xs" id="result-breakdown-list">
        <div class="text-center text-slate-400 py-3">금액을 입력하면 1원 단위 정산표가 계산됩니다.</div>
      </div>

      <!-- 카카오톡 복사용 텍스트 버튼 -->
      <button id="btn-copy-summary" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow transition flex items-center justify-center gap-1.5">
        <i class="fa-regular fa-copy"></i>
        <span>1원 정산 결과 카톡 공유용 복사</span>
      </button>
    </div>

  </main>

  <script type="module">
    // 드롭다운 토글
    const btnDropdown = document.getElementById("btn-dropdown");
    const dropdownMenu = document.getElementById("dropdown-menu");
    btnDropdown.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("hidden");
    });
    document.addEventListener("click", () => dropdownMenu.classList.add("hidden"));

    const members = ["송환오", "장우석", "김진세", "김정수", "이해웅"];
    let selectedMembers = [...members];

    // 참여자 체크박스 생성
    const participantsContainer = document.getElementById("participants-container");
    members.forEach(name => {
      const label = document.createElement("label");
      label.className = "flex items-center justify-between p-2.5 bg-slate-50 hover:bg-slate-100 rounded-lg cursor-pointer transition border border-slate-100";
      label.innerHTML = `
        <div class="flex items-center gap-2">
          <input type="checkbox" value="${name}" checked class="member-checkbox w-4 h-4 text-blue-600 rounded focus:ring-0">
          <strong class="text-slate-800">${name}</strong>
        </div>
        <span class="text-[10px] text-slate-400 font-medium">정산 대상</span>
      `;
      participantsContainer.appendChild(label);
    });

    // 체크박스 이벤트
    const checkboxes = document.querySelectorAll(".member-checkbox");
    checkboxes.forEach(cb => {
      cb.addEventListener("change", () => {
        selectedMembers = Array.from(checkboxes).filter(c => c.checked).map(c => c.value);
        document.getElementById("participant-count-text").innerText = `${selectedMembers.length}명 선택됨`;
        calculateSettlement();
      });
    });

    const inputTotal = document.getElementById("input-total-amount");
    const selectPayer = document.getElementById("select-payer");
    const inputTitle = document.getElementById("input-settle-title");

    inputTotal.addEventListener("input", calculateSettlement);
    selectPayer.addEventListener("change", calculateSettlement);
    inputTitle.addEventListener("input", calculateSettlement);

    let calculatedDetails = [];

    // [핵심] 1원 단위 정밀 N등분 및 자투리 보정 연산
    function calculateSettlement() {
      const rawTotal = parseInt(inputTotal.value, 10);
      const breakdownContainer = document.getElementById("result-breakdown-list");

      if (isNaN(rawTotal) || rawTotal <= 0 || selectedMembers.length === 0) {
        document.getElementById("res-base-amount").innerText = "0원";
        document.getElementById("res-remainder-amount").innerText = "0원";
        breakdownContainer.innerHTML = `<div class="text-center text-slate-400 py-3">금액을 입력하면 1원 단위 정산표가 계산됩니다.</div>`;
        calculatedDetails = [];
        return;
      }

      const count = selectedMembers.length;
      const baseShare = Math.floor(rawTotal / count); // 1원 단위 내림
      const remainder = rawTotal % count;            // 남는 자투리 1~4원

      document.getElementById("res-base-amount").innerText = `${baseShare.toLocaleString()}원`;
      document.getElementById("res-remainder-amount").innerText = `${remainder.toLocaleString()}원`;

      breakdownContainer.innerHTML = "";
      calculatedDetails = [];

      const payer = selectPayer.value;

      selectedMembers.forEach((name, index) => {
        // 남는 자투리 1원은 앞쪽 인원부터 1원씩 공평 배분 (합계 100% 일치)
        const myExtra = index < remainder ? 1 : 0;
        const myFinalAmount = baseShare + myExtra;
        const isPayer = (name === payer);

        calculatedDetails.push({
          name,
          amount: myFinalAmount,
          isPayer
        });

        const div = document.createElement("div");
        div.className = `flex justify-between items-center p-2.5 rounded-lg border ${
          isPayer ? "bg-amber-50 border-amber-200" : "bg-slate-50 border-slate-100"
        }`;
        div.innerHTML = `
          <div class="flex items-center gap-1.5">
            <strong class="text-slate-900">${name}</strong>
            ${isPayer ? '<span class="text-[9px] bg-amber-200 text-amber-900 font-bold px-1.5 py-0.2 rounded">선결제</span>' : ''}
          </div>
          <div class="text-right">
            <span class="font-mono font-black text-sm ${isPayer ? 'text-amber-800' : 'text-blue-600'}">
              ${myFinalAmount.toLocaleString()}원
            </span>
            ${myExtra > 0 ? '<span class="text-[9px] text-slate-400 block font-sans">+잔여 1원 조정</span>' : ''}
          </div>
        `;
        breakdownContainer.appendChild(div);
      });
    }

    // 카카오톡 공유용 복사 버튼
    document.getElementById("btn-copy-summary").onclick = () => {
      if (calculatedDetails.length === 0) {
        alert("먼저 정산 금액을 입력해 주세요.");
        return;
      }

      const total = parseInt(inputTotal.value, 10).toLocaleString();
      const title = inputTitle.value.trim() || "모임 정산";
      const payer = selectPayer.value;

      let msg = `[5인 동창 곗모임 정산 안내 (1원 단위)]\n`;
      msg += `📌 명목: ${title}\n`;
      msg += `💰 총 결제액: ${total}원 (${selectedMembers.length}명 참여)\n`;
      msg += `💳 결제자: ${payer}\n`;
      msg += `---------------------------------\n`;

      calculatedDetails.forEach(item => {
        if (item.isPayer) {
          msg += `• ${item.name} (선결제): ${item.amount.toLocaleString()}원\n`;
        } else {
          msg += `• ${item.name}: ${item.amount.toLocaleString()}원 송금 필요\n`;
        }
      });

      msg += `---------------------------------\n`;
      msg += `💡 1원 단위 오차 없이 계산되었습니다. 확인 후 입금 부탁드립니다!`;

      navigator.clipboard.writeText(msg).then(() => {
        alert("📋 1원 단위 정산 내역이 클립보드에 복사되었습니다!\n카카오톡 단톡방에 붙여넣기 하세요.");
      }).catch(err => {
        alert("복사 실패: " + err);
      });
    };
  </script>

</body>
</html>
