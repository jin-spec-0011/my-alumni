<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>개별 지출 정산소 - 5인 동창 곗모임</title>

  <!-- PWA & 단독 웹앱 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="5인곗모임">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-16 font-sans">

  <!-- 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🧾</span>
        <div>
          <h1 class="font-black text-base text-slate-900 leading-tight">개별 지출 정산소</h1>
          <span class="text-[10px] text-slate-400 font-medium">공금 통장 환급 지급 연동</span>
        </div>
      </div>
      <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
        <i class="fa-solid fa-rotate mr-1"></i>실시간 연동
      </span>
    </div>

    <!-- 5대 탭 네비게이션 -->
    <nav class="flex items-center justify-between border-t border-slate-100 mt-2.5 pt-2 text-xs">
      <div class="flex space-x-1 overflow-x-auto no-scrollbar font-bold">
        <a href="index.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">대시보드</a>
        <a href="history.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">과거 여행</a>
        <a href="wiki.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회칙</a>
        <a href="settlement.html" class="py-1.5 px-2 bg-blue-50 text-blue-600 rounded-lg whitespace-nowrap">개별 정산</a>
        <a href="election.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회장 선출</a>
      </div>

      <div class="relative inline-block text-left ml-1 flex-shrink-0">
        <button id="btn-dropdown" type="button" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg whitespace-nowrap flex items-center gap-1 border border-slate-200">
          <span>더보기 ▾</span>
        </button>
        <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-36 bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 z-50 text-xs font-semibold">
          <a href="gathering.html" class="block px-3 py-2 text-slate-700 hover:bg-slate-50 flex items-center gap-2">
            <i class="fa-solid fa-bullhorn text-amber-600 w-3.5"></i><span>모임 공표</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto p-4 space-y-4">

    <!-- 1. 정산 시즌 선택 (현재 연도/반기 자동 인식) -->
    <div class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-sm flex items-center justify-between text-xs">
      <span class="font-bold text-slate-700 flex items-center gap-1.5">
        <i class="fa-regular fa-calendar-check text-blue-600"></i>
        <span>정산 대상 시즌</span>
      </span>
      <div class="flex items-center gap-1.5">
        <select id="season-year" class="p-1.5 border rounded-lg bg-slate-50 font-bold text-slate-800">
          <option value="2025">2025년</option>
          <option value="2026">2026년</option>
          <option value="2027">2027년</option>
          <option value="2028">2028년</option>
        </select>
        <select id="season-half" class="p-1.5 border rounded-lg bg-slate-50 font-bold text-slate-800">
          <option value="H1">전반기</option>
          <option value="H2">하반기</option>
        </select>
      </div>
    </div>

    <!-- 2. 지출 내역 직접 등록 카드 -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="border-b pb-2 flex justify-between items-center">
        <h2 class="font-black text-sm text-slate-900 flex items-center gap-1.5">
          <i class="fa-solid fa-receipt text-amber-600"></i>
          <span>선결제 지출 등록 (공금 청구)</span>
        </h2>
        <span class="text-[10px] text-slate-400 font-mono">1원 단위 가능</span>
      </div>

      <form id="expense-form" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-700 mb-1">결제자 (입금받을 회원)</label>
            <select id="exp-author" class="w-full p-2 border rounded-lg bg-slate-50 font-bold text-slate-800 text-xs">
              <option value="송환오">송환오</option>
              <option value="장우석">장우석 (총무)</option>
              <option value="김진세">김진세</option>
              <option value="김정수">김정수</option>
              <option value="이해웅">이해웅</option>
            </select>
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">지출 금액 (1원 단위)</label>
            <div class="relative">
              <input type="number" id="exp-amount" step="1" min="1" placeholder="예: 28450" required
                     class="w-full p-2 pr-6 border rounded-lg font-mono font-bold text-slate-900 text-xs focus:ring-2 focus:ring-blue-500">
              <span class="absolute right-2 top-2 text-slate-400 font-bold text-[11px]">원</span>
            </div>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">지출 내용 (항목)</label>
          <div class="flex gap-1.5">
            <input type="text" id="exp-desc" placeholder="예: 택시비, 카페, 유류비 등" required
                   class="flex-1 p-2 border rounded-lg font-medium text-slate-800 text-xs focus:ring-2 focus:ring-blue-500">
            <!-- 빠른 태그 -->
            <button type="button" class="btn-tag px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-[11px] font-bold">택시비</button>
            <button type="button" class="btn-tag px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-[11px] font-bold">카페</button>
            <button type="button" class="btn-tag px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-[11px] font-bold">유류비</button>
          </div>
        </div>

        <button type="submit" id="btn-submit-expense" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow transition">
          공금 청구 영수증 등록
        </button>
      </form>
    </div>

    <!-- 3. 공금 통장 출금 및 지급표 (핵심 정산 화면) -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
      <div class="border-b pb-2 flex justify-between items-center">
        <div>
          <h3 class="font-bold text-sm text-slate-900 flex items-center gap-1.5">
            <i class="fa-solid fa-wallet text-emerald-600"></i>
            <span>공금 통장 지급표 (총무 송금용)</span>
          </h3>
          <p class="text-[10px] text-slate-400 mt-0.5">총무는 아래 금액을 공금 통장에서 각 회원에게 이체합니다.</p>
        </div>
        <span class="text-[10px] bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded border border-emerald-200">
          공금 출금
        </span>
      </div>

      <!-- 시즌 총 지출액 배너 -->
      <div class="p-3 bg-slate-900 text-white rounded-xl space-y-1 text-xs">
        <div class="flex justify-between items-center text-slate-300">
          <span>시즌 공금 총 출금액:</span>
          <strong id="summary-total-spent" class="text-base font-black text-amber-300 font-mono">0원</strong>
        </div>
        <div class="text-[10px] text-slate-400 pt-1 border-t border-white/10">
          * 장우석 총무 공금 계좌에서 1원 단위 그대로 실비 지급
        </div>
      </div>

      <!-- 5인 회원별 실지급액 카드 -->
      <div id="members-settlement-list" class="space-y-1.5 text-xs">
        <div class="text-center text-slate-400 py-4">지출 내역을 불러오는 중...</div>
      </div>

      <!-- 단톡방 공금 정산 보고 복사 버튼 -->
      <button id="btn-copy-settle-report" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl shadow transition flex items-center justify-center gap-1.5">
        <i class="fa-regular fa-copy"></i>
        <span>공금 출금 지급표 카톡 복사 (1원 단위)</span>
      </button>
    </div>

    <!-- 4. 상세 영수증 목록 (삭제 가능) -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-2 text-xs">
      <div class="border-b pb-1.5 flex justify-between items-center">
        <span class="font-bold text-slate-900">시즌 영수증 내역</span>
        <span class="text-[10px] text-slate-400" id="receipt-count-label">총 0건</span>
      </div>
      <div id="receipt-items-container" class="space-y-1.5 text-[11px]">
        <div class="text-center text-slate-400 py-3">등록된 영수증이 없습니다.</div>
      </div>
    </div>

  </main>

  <script type="module">
    import { db } from "./js/firebase.js";
    import { 
      doc, 
      setDoc, 
      deleteDoc,
      collection, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 드롭다운 메뉴 토글
    const btnDropdown = document.getElementById("btn-dropdown");
    const dropdownMenu = document.getElementById("dropdown-menu");
    btnDropdown.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("hidden");
    });
    document.addEventListener("click", () => dropdownMenu.classList.add("hidden"));

    const members = ["송환오", "장우석", "김진세", "김정수", "이해웅"];
    let currentSeasonExpenses = [];

    // [핵심 1] 접속 시점 기준 연도/반기 자동 인식
    const selectYear = document.getElementById("season-year");
    const selectHalf = document.getElementById("season-half");

    function initAutoSeason() {
      const now = new Date();
      const year = String(now.getFullYear());
      const month = now.getMonth() + 1;
      const half = (month <= 6) ? "H1" : "H2";

      selectYear.value = year;
      selectHalf.value = half;
    }
    initAutoSeason();

    function getSeasonKey() {
      return `${selectYear.value}_${selectHalf.value}`;
    }

    // 빠른 태그 버튼
    document.querySelectorAll(".btn-tag").forEach(btn => {
      btn.onclick = () => {
        document.getElementById("exp-desc").value = btn.innerText;
      };
    });

    // [핵심 2] 지출 등록 처리
    const expenseForm = document.getElementById("expense-form");
    expenseForm.onsubmit = async (e) => {
      e.preventDefault();
      const author = document.getElementById("exp-author").value;
      const amount = parseInt(document.getElementById("exp-amount").value, 10);
      const desc = document.getElementById("exp-desc").value.trim();

      if (isNaN(amount) || amount <= 0) {
        alert("금액을 올바른 숫자로 입력해 주세요.");
        return;
      }

      const seasonKey = getSeasonKey();
      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const docId = `exp_${seasonKey}_${Date.now()}`;

      try {
        await setDoc(doc(db, "settlement_expenses", docId), {
          seasonKey,
          author,
          amount,
          desc,
          date: dateStr,
          createdAt: Date.now()
        });

        document.getElementById("exp-amount").value = "";
        document.getElementById("exp-desc").value = "";
      } catch (err) {
        alert(`저장 실패: ${err.message}`);
      }
    };

    // [핵심 3] 공금 출금형 회원별 합산 렌더링
    function calculateAndRender() {
      const spentMap = {};
      members.forEach(m => spentMap[m] = 0);

      let grandTotal = 0;
      currentSeasonExpenses.forEach(item => {
        if (spentMap[item.author] !== undefined) {
          spentMap[item.author] += item.amount;
        } else {
          spentMap[item.author] = item.amount;
        }
        grandTotal += item.amount;
      });

      document.getElementById("summary-total-spent").innerText = `${grandTotal.toLocaleString()}원`;

      // 회원별 지급액 목록
      const settleListContainer = document.getElementById("members-settlement-list");
      settleListContainer.innerHTML = "";

      members.forEach(name => {
        const mySpent = spentMap[name] || 0;
        const div = document.createElement("div");
        div.className = `flex justify-between items-center p-2.5 rounded-xl border ${
          mySpent > 0 ? "bg-emerald-50/70 border-emerald-200" : "bg-slate-50 border-slate-200 opacity-60"
        }`;

        let statusHtml = "";
        if (mySpent > 0) {
          statusHtml = `<span class="font-mono font-black text-emerald-700 text-sm">공금에서 ${mySpent.toLocaleString()}원 지급</span>`;
        } else {
          statusHtml = `<span class="font-mono font-medium text-slate-400 text-xs">지출 내역 없음</span>`;
        }

        div.innerHTML = `
          <div>
            <strong class="text-slate-900">${name}</strong>
            <span class="text-[10px] text-slate-400 block">${name === '장우석' ? '🛡️ 총무 계좌 관리' : '선결제 정산 대상'}</span>
          </div>
          <div class="text-right">
            ${statusHtml}
          </div>
        `;
        settleListContainer.appendChild(div);
      });

      // 영수증 목록 렌더링
      const receiptContainer = document.getElementById("receipt-items-container");
      document.getElementById("receipt-count-label").innerText = `총 ${currentSeasonExpenses.length}건`;
      receiptContainer.innerHTML = "";

      if (currentSeasonExpenses.length === 0) {
        receiptContainer.innerHTML = `<div class="text-center text-slate-400 py-3">해당 시즌에 등록된 영수증이 없습니다.</div>`;
        return;
      }

      currentSeasonExpenses.forEach(item => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "flex justify-between items-center p-2 bg-slate-50 border border-slate-100 rounded-lg";
        itemDiv.innerHTML = `
          <div class="flex items-center gap-1.5">
            <span class="font-bold text-slate-800">${item.author}</span>
            <span class="text-slate-400">•</span>
            <span class="text-slate-600">${item.desc}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-mono font-bold text-slate-900">${item.amount.toLocaleString()}원</span>
            <button class="btn-del-exp text-slate-400 hover:text-rose-600 p-1" data-id="${item.id}" title="삭제">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>
        `;
        receiptContainer.appendChild(itemDiv);
      });

      document.querySelectorAll(".btn-del-exp").forEach(btn => {
        btn.onclick = async (e) => {
          const docId = e.currentTarget.getAttribute("data-id");
          if (!confirm("이 영수증 내역을 삭제하시겠습니까?")) return;
          try {
            await deleteDoc(doc(db, "settlement_expenses", docId));
          } catch(err) {
            alert(`삭제 실패: ${err.message}`);
          }
        };
      });
    }

    // Firestore 리스너 연동
    let unsubscribe = null;
    function subscribeSeasonData() {
      if (unsubscribe) unsubscribe();

      const currentKey = getSeasonKey();
      try {
        unsubscribe = onSnapshot(collection(db, "settlement_expenses"), (snapshot) => {
          const list = [];
          snapshot.forEach(docSnap => {
            const data = docSnap.data();
            if (data.seasonKey === currentKey) {
              list.push({ id: docSnap.id, ...data });
            }
          });
          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          currentSeasonExpenses = list;
          calculateAndRender();
        });
      } catch (err) {
        console.error("Firestore 연결 에러:", err);
      }
    }

    selectYear.addEventListener("change", subscribeSeasonData);
    selectHalf.addEventListener("change", subscribeSeasonData);
    subscribeSeasonData();

    // [카카오톡 공금 출금 내역 복사]
    document.getElementById("btn-copy-settle-report").onclick = () => {
      const year = selectYear.value;
      const halfName = selectHalf.value === "H1" ? "전반기" : "하반기";

      let grandTotal = 0;
      const spentMap = {};
      members.forEach(m => spentMap[m] = 0);

      currentSeasonExpenses.forEach(item => {
        spentMap[item.author] = (spentMap[item.author] || 0) + item.amount;
        grandTotal += item.amount;
      });

      let msg = `[5인 동창회 ${year}년 ${halfName} 공금 출금 정산서]\n`;
      msg += `💰 공금 총 출금액: ${grandTotal.toLocaleString()}원\n`;
      msg += `🏦 출금 계좌: 모임 공금 통장 (장우석 총무)\n`;
      msg += `------------------------------------\n`;
      msg += `[회원별 개인 계좌 지급액]\n`;

      let hasPayout = false;
      members.forEach(name => {
        const mySpent = spentMap[name] || 0;
        if (mySpent > 0) {
          hasPayout = true;
          msg += `• ${name}: ${mySpent.toLocaleString()}원 입금 필요\n`;
        }
      });

      if (!hasPayout) {
        msg += `(등록된 지출 내역이 없습니다.)\n`;
      }

      msg += `------------------------------------\n`;
      msg += `📌 장우석 총무님은 확인 후 위 금액을 각 회원 계좌로 이체해 주세요! (1원 단위 정확 반영)`;

      navigator.clipboard.writeText(msg).then(() => {
        alert("📋 공금 출금 지급표가 복사되었습니다!\n단톡방에 붙여넣어 총무님께 이체를 요청하세요.");
      }).catch(err => {
        alert("복사 실패: " + err);
      });
    };
  </script>

</body>
</html>
