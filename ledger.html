<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>회비 장부 (비활성화) - 5인 동창 곗모임</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-16 font-sans">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🏦</span>
        <div>
          <h1 class="font-black text-base text-slate-900 leading-tight">회비 장부</h1>
          <span class="text-[10px] text-slate-400 font-medium">서비스 운영 종료 안내</span>
        </div>
      </div>
      <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 border">
        기능 일시 중단
      </span>
    </div>

    <nav class="flex items-center justify-between border-t border-slate-100 mt-2.5 pt-2 text-xs">
      <div class="flex space-x-1 overflow-x-auto no-scrollbar font-bold">
        <a href="index.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">대시보드</a>
        <a href="history.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">과거 여행</a>
        <a href="wiki.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회칙</a>
        <a href="settlement.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">개별 정산</a>
        <a href="election.html" class="py-1.5 px-2 text-slate-600 hover:text-slate-900 rounded-lg whitespace-nowrap">회장 선출</a>
      </div>

      <div class="relative inline-block text-left ml-1 flex-shrink-0">
        <button id="btn-dropdown" type="button" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg whitespace-nowrap flex items-center gap-1 border border-slate-200">
          <span>더보기 ▾</span>
        </button>
        <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-36 bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 z-50 text-xs font-semibold">
          <a href="gathering.html" class="block px-3 py-2 text-slate-700 hover:bg-slate-50 flex items-center gap-2">
            <i class="fa-solid fa-calendar-check text-blue-600 w-3.5"></i><span>모임 공표</span>
          </a>
          <a href="ledger.html" class="block px-3 py-2 text-slate-400 bg-slate-50 flex items-center gap-2 cursor-not-allowed">
            <i class="fa-solid fa-lock text-slate-400 w-3.5"></i><span>회비 장부 (중단)</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-1 w-full max-w-md mx-auto p-4 flex flex-col justify-center">

    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm text-center space-y-4">
      <div class="w-14 h-14 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto text-2xl border border-amber-200">
        <i class="fa-solid fa-piggy-bank"></i>
      </div>

      <div>
        <h2 class="text-base font-black text-slate-900">회비 장부 페이지 비활성화 안내</h2>
        <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">
          곗돈 수납 및 통장 잔액 관리는 <strong>카카오뱅크 모임통장</strong>으로 일원화되어 본 웹페이지 서비스가 공식 비활성화되었습니다.
        </p>
      </div>

      <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl text-left text-xs space-y-1.5 text-slate-600">
        <div class="flex items-center gap-1.5 font-bold text-slate-800">
          <i class="fa-solid fa-circle-info text-blue-500"></i>
          <span>안내 사항</span>
        </div>
        <p class="text-[11px] leading-relaxed">
          • 실시간 통장 잔액 및 입출금 확인은 총무의 카카오뱅크 모임통장을 확인해 주세요.<br>
          • 모임 관련 개인 실비(교통비·식비) 청구 및 등록은 <strong>[개별 정산소]</strong> 탭을 이용하시면 됩니다.
        </p>
      </div>

      <div class="space-y-2 pt-2">
        <a href="index.html" class="block w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl transition shadow-sm">
          대시보드로 돌아가기
        </a>
        <a href="settlement.html" class="block w-full py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold rounded-xl transition border border-blue-200">
          개별 정산소로 이동
        </a>
      </div>
    </div>

  </main>

  <script>
    // 드롭다운 토글
    const btnDropdown = document.getElementById("btn-dropdown");
    const dropdownMenu = document.getElementById("dropdown-menu");
    btnDropdown.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("hidden");
    });
    document.addEventListener("click", () => dropdownMenu.classList.add("hidden"));
  </script>

</body>
</html>
